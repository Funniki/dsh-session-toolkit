# Bundle patch: one plugin pack with five components.
#
# Each row names one original plugin package, so every component keeps its own
# package display metadata (title, description, icon) and its own browser half.
# The five component packages are installed as profile dependencies of this
# pack (see README); they are not separate bundles.
- insert:
    - id: archived-session-delete
      name: 'dsh-archived-session-delete'
      config: {}
    - id: session-move
      name: 'dsh-session-move'
      config: {}
    - id: unsent-content-guard
      name: 'dsh-unsent-content-guard'
      config: {}
    - id: session-history-search
      name: 'dsh-session-history-search'
      config: {}
    - id: auto-paste
      name: 'dsh-auto-paste'
      config:
        minChars: 500
        maxBytes: 1048576
