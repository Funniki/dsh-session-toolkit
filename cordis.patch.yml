# Bundle patch: one plugin pack with five components.
#
# Each row is a RELATIVE path anchored beside this file, pointing at the
# component's host entry module. ESM cannot import a directory, so the entry
# file is named explicitly; the loader finds each component's own package.json
# (and therefore its `dsh.client` browser half) from that file's location.
#
# Relative rows are what make an npm install of this package self-contained: the
# components ship inside the tarball and resolve wherever it is unpacked, with no
# profile-level dependency wiring and no junction.
- insert:
    - id: archived-session-delete
      name: './components/dsh-archived-session-delete/lib/host.js'
      config: {}
    - id: session-move
      name: './components/dsh-session-move/lib/host.js'
      config: {}
    - id: unsent-content-guard
      name: './components/dsh-unsent-content-guard/lib/host-v106.js'
      config: {}
    - id: session-history-search
      name: './components/dsh-session-history-search/lib/host.js'
      config: {}
    - id: auto-paste
      name: './components/dsh-auto-paste/dist/index.js'
      config:
        minChars: 500
        maxBytes: 1048576
