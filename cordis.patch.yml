# Bundle patch: one plugin pack with five components.
#
# Each row is a SUBPATH of this package. That shape is what keeps both halves of
# a component working after an npm install:
#
# - the host half resolves to the component's entry module through `exports`;
# - the plugin page still has a package specifier, so it reads the component's
#   own `locale/*.json` and `icon` (exported per component) for the display
#   title, description and icon instead of showing a raw module path.
#
# An absolute `file:` row also loads, but `readPluginMeta` skips non-package
# specifiers entirely, which is why those rows lost their names and icons.
- insert:
    - id: archived-session-delete
      name: '@funniki/dsh-session-toolkit/components/dsh-archived-session-delete'
      config: {}
    - id: session-move
      name: '@funniki/dsh-session-toolkit/components/dsh-session-move'
      config: {}
    - id: unsent-content-guard
      name: '@funniki/dsh-session-toolkit/components/dsh-unsent-content-guard'
      config: {}
    - id: session-history-search
      name: '@funniki/dsh-session-toolkit/components/dsh-session-history-search'
      config: {}
    - id: auto-paste
      name: '@funniki/dsh-session-toolkit/components/dsh-auto-paste'
      config:
        minChars: 500
        maxBytes: 1048576
